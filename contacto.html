<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto | FANAOCAVI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav class="navbar">
        <div class="logo"><a href="index.html" style="text-decoration:none; color:inherit;">FANAOCAVI</a></div>
        <ul class="nav-links">
            <li><a href="sobre-mi.html">SOBRE MÍ</a></li>
            <li><a href="historias.html">HISTORIAS</a></li>
            <li><a href="fotografias.html">FOTOGRAFÍAS</a></li>
            <li><a href="videos.html">VIDEOS</a></li>
            <li><a href="contacto.html" style="color: var(--rosa-acento);">CONTACTO</a></li>
        </ul>
    </nav>

    <main class="contact-section">
        <header class="contact-header">
            <p class="intro-tag">Hablemos</p>
            <h1>¿Tienes un proyecto en mente o una historia que contar?</h1>
        </header>

        <div class="contact-container">
            <div class="contact-info">
                <div class="info-item">
                    <h3>Ubicación</h3>
                    <p>Lima, Perú</p>
                </div>
                <div class="info-item">
                    <h3>Email</h3>
                    <p>fncabezas@bausate.edu.pe</p>
                </div>
                <div class="info-item">
                    <h3>Redes Sociales</h3>
                    <p>LinkedIn / TikTok / Instagram</p>
                </div>
            </div>

            <form class="contact-form">
                <div class="form-group">
                    <label>Nombre Completo</label>
                    <input type="text" name="name" placeholder="Tu nombre aquí..." required>
                </div>
                <div class="form-group">
                    <label>Correo Electrónico</label>
                    <input type="email" name="email" placeholder="fncabezas@bausate.edu.pe" required>
                </div>
                <div class="form-group">
                    <label>Mensaje</label>
                    <textarea name="message" rows="5" placeholder="Cuéntame sobre tu propuesta..." required></textarea>
                </div>
                <button type="submit" class="btn-send">ENVIAR MENSAJE</button>
            </form>
        </div>
    </main>

   <footer class="footer">
    <div class="footer-line"></div>
    <div class="social-icons">
        <a href="https://www.instagram.com/fanaocavi_/" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
            <i class="fab fa-instagram"></i>
        </a>
        <a href="https://www.tiktok.com/@fanaocavi" target="_blank" rel="noopener noreferrer" aria-label="TikTok">
            <i class="fab fa-tiktok"></i>
        </a>
    </div>
    <p>© 2026 — Lima, Perú</p>
</footer>

</body>
</html>
